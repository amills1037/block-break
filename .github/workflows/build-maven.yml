on:
  workflow_call:
    inputs:
        dir:
          description: Directory
          required: true
          type: string

jobs:
  build:
    name: Build ${{ inputs.dir }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto # AWS's version of Java
          java-version: "25"
          cache: maven

      - name: Build package
        run: |
          mvn package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pull-request-${{ inputs.dir }}
          path: ${{ inputs.dir }}/target/
