name: Staging Server
on:
  push:
    branches: [feature/server]

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.actor }}/blockbreak-server

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"
          ## cache: 'maven' should look into this

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./src/main/resource/image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.actor }}/blockbreak-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
