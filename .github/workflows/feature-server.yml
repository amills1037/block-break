name: Feature branch, client server
on:
  push:
    branches:
      - feature/**
    paths:
      - server/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Test server
    uses: ./.github/workflows/templates/test-maven.yml
    with:
      dir: server
