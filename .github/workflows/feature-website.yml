name: Feature branch, website code
on:
  push:
    branches:
      - feature/**
    paths:
      - .github/workflows/**
      - website/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-website:
    name: Test website
    uses: ./.github/workflows/test-npm.yml
    with:
      dir: website
