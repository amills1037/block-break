name: Feature branch, client code
on:
  push:
    branches:
      - feature/**
    paths:
      - client

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-client:
    name: Test client
    runs-on: ubuntu-latest
    steps:
      - uses: ./templates/test-npm.yml
        with:
          dir: client
