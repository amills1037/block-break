name: Build block break
on:
  push:
    branches: [main]

permissions: 
  id-token: write
  contents: read

jobs:
  build:
    environment:
        name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Specify your Node version

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Artifact to s3
        run: aws s3 cp --recursive build/* s3://${{ vars.S3BUCKET }}/
