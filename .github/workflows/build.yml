name: Build block break
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-website:
    environment:
      name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Specify your Node version

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Artifact to s3
        run: aws s3 cp --recursive dist/ s3://${{ vars.S3BUCKET }}/
  build-client:
    environment:
      name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Specify your Node version

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Artifact to s3
        run: aws s3 cp --recursive dist/ s3://${{ vars.S3BUCKET }}/client/

  build-serverless:
    environment:
      name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./serverless
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"
          ## cache: 'maven' should look into this

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Artifact to s3
        run: aws s3 cp target/serverless-*.jar s3://${{ vars.CODE_DEPLOY_BUCKET }}/serverless/

      - name: Deploy to AWS Lambda
        run: aws lambda update-function-code --function-name websocket-serverless-lambda --zip-file fileb://target/serverless-1.0-SNAPSHOT.jar
