on:
  workflow_call:
    inputs:
        dir:
          description: Directory
          required: true
          type: string

jobs:
  test:
    name: Build ${{ inputs.dir }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run buld
        run: npm run build

      # - name: Upload artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: production-${{ inputs.dir }}
      #     path: ${{ inputs.dir }}/dist/
