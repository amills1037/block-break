name: Deploy staging
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/**
      - website/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-website:
    name: Test website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/test-npm.yml
    with:
      dir: website

  build-website:
    name: Build website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/build-npm.yml
    with:
      dir: website

  deploy-website:
    name: Deploy website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs:
      - test-website
      - build-website
    uses: ./.github/workflows/deploy-npm.yml
    with:
      dir: website
      stage: staging
