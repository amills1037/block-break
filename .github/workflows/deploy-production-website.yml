name: Deploy Staging
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - website/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-website:
    name: Deploy production website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deploy production website ${{ github.event.pull_request.number }}"

  cleanup:
    name: Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
        - run: |
            echo "Clean up, clean up, everybody clean up... ${{ github.event.pull_request.number }}"
