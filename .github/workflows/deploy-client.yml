name: Deploy client
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - .github/workflows/**
      - client/**
      - app/**

permissions:
  id-token: write
  contents: read

## concurrency should be on a per job level
# concurrency:
#   group: ${{ github.event_name }}-${{ github.event.action}}-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  test-app:
    name: Test app
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - run: |
          echo "Test rust app"

  build-app:
    name: Build app
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - run: |
          echo "Build rust app"

  test-client:
    name: Test client
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/test-npm.yml
    with:
      dir: client

  build-client:
    name: Build client
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/build-npm.yml
    with:
      dir: client

  deploy-client:
    name: Deploy client
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs:
      - test-client
      - build-client
      - test-app
      - build-app
    uses: ./.github/workflows/deploy-npm.yml
    with:
      dir: client
      aws_region: ${{ vars.AWS_REGION }}
      s3_deploy_bucket: ${{ vars.S3_DEPLOY_BUCKET }}
    secrets:
      iam_role_github: ${{ secrets.IAMROLE_GITHUB }}

  deploy-staging-client:
    name: Deploy staging client
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3 staging folder
        run: |
            aws s3 cp \
            s3://${{ vars.s3_deploy_bucket }}/client/pr-${{ github.event.pull_request.number }}/ \
            s3://${{ vars.s3_deploy_bucket }}/client/staging/ \
            --recursive

      - name: Upload artifact to S3 bucket
        run: |
            aws s3 cp \
            s3://${{ vars.s3_deploy_bucket }}/client/pr-${{ github.event.pull_request.number }}/ \
            s3://${{ vars.s3_bucket }}/client/ \
            --recursive

      - name: Remove S3 PR folder
        run: |
            aws s3 rm \
            s3://${{ vars.s3_deploy_bucket }}/client/pr-${{ github.event.pull_request.number }}/ \
            --recursive

  deploy-production-client:
    name: Deploy production client
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: deploy-staging-client
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3 production folder
        run: |
            aws s3 cp \
            s3://${{ vars.s3_deploy_bucket }}/client/staging/ \
            s3://${{ vars.s3_deploy_bucket }}/client/production/ \
            --recursive

      - name: Upload artifact to S3 bucket
        run: |
            aws s3 cp \
            s3://${{ vars.s3_deploy_bucket }}/client/production/ \
            s3://${{ vars.s3_bucket }}/client/ \
            --recursive

  cleanup:
    name: Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
    needs: deploy-staging-website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Remove S3 PR folder
        run: |
            aws s3 rm \
            s3://${{ vars.s3_deploy_bucket }}/website/pr-${{ github.event.pull_request.number }}/ \
            --recursive

      - run: |
          echo "Clean up, clean up, everybody clean up... ${{ github.event.pull_request.number }}"
