name: Deploy website
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - .github/workflows/**
      - website/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - website/**

permissions:
  id-token: write
  contents: read

## concurrency should be on a per job level
# concurrency:
#   group: ${{ github.event_name }}-${{ github.event.action}}-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  test-website:
    name: Test website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/test-npm.yml
    with:
      dir: website

  build-website:
    name: Build website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: ./.github/workflows/build-npm.yml
    with:
      dir: website

  deploy-website:
    name: Deploy website
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs:
      - test-website
      - build-website
    uses: ./.github/workflows/deploy-npm.yml
    with:
      dir: website
      aws_region: ${{ vars.AWS_REGION }}
      s3_deploy_bucket: ${{ vars.S3_DEPLOY_BUCKET }}
    secrets:
      iam_role_github: ${{ secrets.IAMROLE_GITHUB }}

  deploy-staging-website:
    name: Deploy staging website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env-npm.yml
    with:
      dir: website
      stage: staging

  deploy-production-website:
    name: Deploy production website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging-website
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - run: |
          echo "Deploy production website ${{ github.event.pull_request.number }}"

  cleanup:
    name: Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - run: |
          echo "Clean up, clean up, everybody clean up... ${{ github.event.pull_request.number }}"
