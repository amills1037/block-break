AWSTemplateFormatVersion: 2010-09-09

Description: |
  Serverless application resources

Parameters:
  Stack:
    Description: Software Stack
    Type: String
    Default: Production
    AllowedValues:
      - Sandbox
      - Production

Mappings:
  RegionDirection:
    us-east-1:
      Direction: East
    us-west-2:
      Direction: West
    ca-central-1:
      Direction: Central

Resources:
  ServerlessLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ServerlessLambdaRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Effect: Allow
          Principal:
            Service: "lambda.amazonaws.com"
          Action: "sts:AssumeRole"
      Tags:
        - Key: Stack
          Value: !Ref Stack
        - Key: Region
          Value: !FindInMap [RegionDirection, !Ref AWS::Region, Direction]

  ServerlessLambdaRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ServerlessLambdaRole
      PolicyName: ServerlessLambdaRolePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - "*"

  ServerlessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: websocket-serverless-lambda
      Handler: ca.blockbreak.serverless.App
      Code:
        S3Bucket: !ImportValue CodeDeployS3Bucket
        S3Key: serverless/serverless-1.0-SNAPSHOT.jar
      Runtime: java25
      Timeout: 5
      Role: !GetAtt ServerlessLambdaRole.Arn
      Tags:
        - Key: Stack
          Value: !Ref Stack
        - Key: Region
          Value: !FindInMap [RegionDirection, !Ref AWS::Region, Direction]

  ServerlessAPIGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ServerlessWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      ApiKeySelectionExpression: $request.header.x-api-key
      Tags:
        Stack: !Ref Stack
        Region: !FindInMap [RegionDirection, !Ref AWS::Region, Direction]

  ServerlessStatsDynamoDB:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ServerlessStatsDB
      AttributeDefinitions:
        - AttributeName: PlayerId
          AttributeType: S
        - AttributeName: StatName
          AttributeType: S
      KeySchema:
        - AttributeName: PlayerId
          KeyType: HASH
        - AttributeName: StatName
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Stack
          Value: !Ref Stack
        - Key: Region
          Value: !FindInMap [RegionDirection, !Ref AWS::Region, Direction]
