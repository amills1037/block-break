AWSTemplateFormatVersion: 2010-09-09

Description: |
  Bootstrap resources that remain active 24/7

## list of parameters to enter when creating the stack
Parameters:
  DomainName:
    Type: String
    Description: Domain name (e.g., example.com).
    ConstraintDescription: Must be a valid DNS-compliant name.
  ## Would be convenient to get the hosted zone from the domain name
  ## or the domain name from the hosted zone, but there does not seem to be a clean way to do that
  DomainHostedZone:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 hosted zone id.

  WebCertificate:
    Type: String
    Description: Enter the ARN of the target resource.
    AllowedPattern: "^arn:aws:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:.+"
    ConstraintDescription: "Must be a valid AWS ARN (e.g., arn:aws:s3:::my-bucket)."
    ## arn:aws:acm:us-east-1:743114209664:certificate/2d40b051-c672-43e1-9aa5-97a2d9b8ba48
    ##Should look into this: Fn::GetStackOutput

Resources:
  ## For website
  ## naked domain bucket used to redirect to www
  ApexDomainS3Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      Guard:
        SuppressedRules:
          - S3_BUCKET_VERSIONING_ENABLED
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName:
        !Join ["-", ["cloudfront", !Join ["-", !Split [".", !Ref DomainName]]]]
      WebsiteConfiguration:
        RedirectAllRequestsTo:
          HostName: !Join [".", ["www", !Ref DomainName]]
          Protocol: https
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ## www domain, hosts the static files
  WWWDomainS3Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      Guard:
        SuppressedRules:
          - S3_BUCKET_VERSIONING_ENABLED
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName:
        !Join [
          "-",
          ["cloudfront", "www", !Join ["-", !Split [".", !Ref DomainName]]],
        ]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ApexDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: ApexDomainS3Bucket
            # Use the S3 Website Endpoint, NOT the bucket ARN
            DomainName:
              !Select [2, !Split ["/", !GetAtt ApexDomainS3Bucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: ApexDomainS3Bucket
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          AcmCertificateArn: !Ref WebCertificate
          MinimumProtocolVersion: TLSv1.3_2025
          SslSupportMethod: sni-only

  WWWDistributionOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-WWW-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WWWDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Join [".", ["www", !Ref DomainName]]
        Origins:
          - Id: WWWDomainS3BucketOrigin
            DomainName: !GetAtt WWWDomainS3Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WWWDistributionOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # Empty when using OAC
        DefaultCacheBehavior:
          TargetOriginId: WWWDomainS3BucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS Managed-CachingDisabled
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref WebCertificate
          MinimumProtocolVersion: TLSv1.3_2025
          SslSupportMethod: sni-only

  WWWDomainS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WWWDomainS3Bucket
      PolicyDocument:
        Statement:
          - Action: "s3:GetObject"
            Effect: Allow
            Resource: !Sub "${WWWDomainS3Bucket.Arn}/*"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WWWDistribution}"

  ApexRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DomainHostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApexDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # Static hosted zone ID for CloudFront

  WWWRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DomainHostedZone
      Name: !Join [".", ["www", !Ref DomainName]]
      Type: CNAME
      ResourceRecords:
        - !GetAtt WWWDistribution.DomainName
      TTL: 300

  ## For code deployment
  CodeDeployS3Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      Guard:
        SuppressedRules:
          - S3_BUCKET_VERSIONING_ENABLED
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName:
        !Join ["-", ["codedeploy", !Join ["-", !Split [".", !Ref DomainName]]]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ## ThumbprintList: # is not needed because AWS uses a CA to verify the thumbprint

  GitHubCodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BootstrapGitHubCodeDeploy
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Effect: Allow
          Principal:
            Federated: !Ref GitHubOIDCProvider
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringLike:
              "token.actions.githubusercontent.com:sub": repo:amills1037/block-break:*
            StringEquals:
              "token.actions.githubusercontent.com:aud": sts.amazonaws.com

  GitHubS3PutRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref GitHubCodeDeployRole
      PolicyName: GitHubS3PutRolePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Join ["/", [!GetAtt WWWDomainS3Bucket.Arn, "*"]]

Outputs:
  CodeDeployS3Bucket:
    Description: Bucket to store code for lambdas
    Value: !Ref CodeDeployS3Bucket
    Export:
      Name: CodeDeployS3Bucket
