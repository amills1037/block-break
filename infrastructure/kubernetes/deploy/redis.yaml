apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: block-break
spec:
  ports:
    - protocol: TCP
      port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-statefulset
  namespace: block-break
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - server
      containers:
        - name: redis
          image: redis:8.8-alpine
          resources:
             requests:
               memory: "512Mi"
               cpu: "250m"
             limits:
               memory: "1024Mi"
               cpu: "500m"
          ports:
            - containerPort: 6379
              name: redis
