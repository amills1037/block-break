apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: block-break
spec:
  ports:
    - protocol: TCP
      port: 3306
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-statefulset
  namespace: block-break
spec:
  serviceName: mariadb-service
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - server
      containers:
        - name: mariadb
          image: mariadb:12.3
          resources:
             requests:
               memory: "1024Mi"
               cpu: "500m"
             limits:
               memory: "2048Mi"
               cpu: "1000m"
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MARIADB_ROOT_PASSWORD
              ## kubectl create secret generic -n block-break maria-db-secret --from-literal=password=ChangeMe!
              valueFrom:
                secretKeyRef:
                  name: maria-db-secret
                  key: password
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-storage-pvc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: block-break-mariadb-storage-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: database-storage
  csi:
    driver: iscsi.csi.k8s.io
    volumeHandle: iscsi-192.168.7.227-block-break:mariadb-1  # Must be globally unique
    volumeAttributes:
      targetPortal: 192.168.7.227:3260
      portals: "[]"
      iqn: iqn.2026-09.block-break:mariadb
      lun: "1"
      iscsiInterface: "default"
      discovery: "true"
      discoveryCHAPAuth: "true"
      sessionCHAPAuth: "false"
      fsType: "ext4"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-storage-pvc
  namespace: block-break
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: database-storage
  volumeName: block-break-mariadb-storage-pv
  resources:
    requests:
      storage: 10Gi
