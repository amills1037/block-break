apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: block-break
spec:
  ports:
    - protocol: TCP
      port: 5432
  selector:
    app: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-statefulset
  namespace: block-break
spec:
  serviceName: postgresql-service
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - server
      containers:
        - name: postgresql
          image: postgres:18.4
          resources:
             requests:
               memory: "1024Mi"
               cpu: "500m"
             limits:
               memory: "2048Mi"
               cpu: "1000m"
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_PASSWORD
              ## kubectl create secret generic -n block-break postgresql-db-secret --from-literal=password=ChangeMe!
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: password
          volumeMounts:
            - name: postgresql-storage
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgresql-storage
          persistentVolumeClaim:
            claimName: postgresql-storage-pvc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: block-break-postgresql-storage-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: database-storage
  csi:
    driver: iscsi.csi.k8s.io
    volumeHandle: iscsi-192.168.7.227-block-break:postgresql-1  # Must be globally unique
    volumeAttributes:
      targetPortal: 192.168.7.227:3260
      portals: "[]"
      iqn: iqn.2026-09.block-break:postgresql
      lun: "1"
      iscsiInterface: "default"
      discovery: "true"
      discoveryCHAPAuth: "true"
      sessionCHAPAuth: "false"
      fsType: "ext4"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-storage-pvc
  namespace: block-break
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: database-storage
  volumeName: block-break-postgresql-storage-pv
  resources:
    requests:
      storage: 10Gi
